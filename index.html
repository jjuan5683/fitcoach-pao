<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitCoach</title>
<meta name="description" content="Entrenamiento para el 10K: plan de la semana, registro de sesiones y progreso.">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitCoach">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
:root{
  --bg:#fafaf7; --surface:#ffffff; --surface-2:#f1efe9; --line:#d9d5cc;
  --text:#1a1a1a; --muted:#4f4f4f; --accent:#c2410c; --accent-text:#ffffff; --accent-ink:#9a3412; --accent-line:#9a3412; --chart:#c2410c; --navy:#0f2742; --wm-op:.07; --fit:#52525b; --swoosh:#111111;
  --ok:#1d6b35; --ok-bg:#e6f4ea; --warn:#7a4f00; --warn-bg:#fdf1d8; --bad:#a61b1b; --bad-bg:#fde8e8;
  --focus:#1d4ed8; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --radius:14px; --fs:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="sun"]){
    --bg:#141414; --surface:#1f1f1f; --surface-2:#2a2a2a; --line:#3a3a3a;
    --text:#f3f3f3; --muted:#c4c4c4; --accent:#fb923c; --accent-text:#111111; --accent-ink:#fdba74; --accent-line:#fb923c; --chart:#fb923c; --navy:#0b1a2e; --wm-op:.09; --fit:#a1a1aa; --swoosh:#e4e4e7;
    --ok:#7bd39a; --ok-bg:#16301f; --warn:#f3c76b; --warn-bg:#33280f; --bad:#ff9b9b; --bad-bg:#3a1717;
    --focus:#93b4ff; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1f1f1f; --surface-2:#2a2a2a; --line:#3a3a3a;
  --text:#f3f3f3; --muted:#c4c4c4; --accent:#fb923c; --accent-text:#111111; --accent-ink:#fdba74; --accent-line:#fb923c; --chart:#fb923c; --navy:#0b1a2e; --wm-op:.09; --fit:#a1a1aa; --swoosh:#e4e4e7;
  --ok:#7bd39a; --ok-bg:#16301f; --warn:#f3c76b; --warn-bg:#33280f; --bad:#ff9b9b; --bad-bg:#3a1717;
  --focus:#93b4ff; --shadow:none; color-scheme:dark;
}
:root[data-size="grande"]{ --fs:20px; }
:root{--t-easy:#15803d;--t-runwalk:#0f766e;--t-long:#b45309;--t-strength:#7c3aed;--t-walk:#2563eb;--t-cross:#0e7490;--t-rest:#6b7280;--t-race:#be123c;--limb:#1f2937;
  --hero-a:#16365c;--hero-b:#07111f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="sun"]){--limb:#e5e7eb;--hero-a:#13304f;--hero-b:#040a14}}
:root[data-theme="dark"]{--limb:#e5e7eb;--hero-a:#13304f;--hero-b:#040a14}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 var(--fs)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);color:var(--text);padding:10px 14px;border-radius:10px;z-index:99}
.skip:focus{top:8px}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.brand svg{height:30px;width:auto;display:block}
.brand .mascot{height:52px;width:auto;max-width:150px;flex:none;object-fit:contain;display:block}
.top-actions{display:flex;align-items:center;gap:8px}
.iconbtn{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;background:var(--surface);color:var(--text);border:2px solid var(--line)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Marca de agua: el escudo fijo detrás del contenido */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("./logo.webp") center 55%/min(88vw,560px) auto no-repeat;opacity:var(--wm-op)}
main,header.top,nav.tabs,#updateBar{position:relative;z-index:1}
header.top{position:sticky;z-index:10}
nav.tabs{position:fixed;z-index:20}
.hero img.mascot-bg{object-fit:contain}
.photo{width:100%;height:auto;border-radius:10px;display:block;background:#2b2f26}
.photo-note{font-size:.8em;color:var(--muted);margin:4px 0 0}
.avatar{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--hero-a);color:#fff;
  font-weight:900;font-size:1.1em;text-decoration:none;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent-line)}
.avatar[aria-current="page"]{box-shadow:0 0 0 3px var(--focus)}
.avatar svg{width:24px;height:24px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5em;line-height:1.2;margin:4px 0 12px}
h2{font-size:1.15em;margin:0 0 8px}
h3{font-size:1em;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.88em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card.accent{border-left:6px solid var(--accent-line)}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 14px;border:1px solid transparent}
.banner.ok{background:var(--ok-bg);color:var(--ok);border-color:currentColor}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:currentColor}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:currentColor}
.banner b,.banner strong{color:inherit}
.banner p:last-child{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 > *{min-width:0}
input,select,textarea{min-width:0;max-width:100%}
@media (max-width:380px){:root[data-size="grande"] .grid2{grid-template-columns:1fr}}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .v{font-size:1.35em;font-weight:800;line-height:1.2}
.stat .l{font-size:.82em;color:var(--muted)}
button,.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--accent-line);
  background:var(--accent);color:var(--accent-text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
button.plain{background:var(--surface-2);border-color:var(--line);color:var(--text)}
button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button.block{width:100%}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:700;margin:0 0 4px}
.hint{font-weight:500;font-size:.85em;color:var(--muted);display:block}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
textarea{min-height:120px;resize:vertical}
.field{margin:0 0 14px}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-weight:700;margin:0 0 6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;min-width:48px;padding:8px 14px;border-radius:999px;
  border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;user-select:none}
.chip input:checked + span{background:var(--accent);border-color:var(--accent-line);color:var(--accent-text)}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.rpe .chip span{min-width:52px;padding:6px 8px;flex-direction:column;gap:0;line-height:1.1}
.rpe .chip span small{font-size:.65em;font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:28px;height:28px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.check label{font-weight:600;margin:0}
.daylist{list-style:none;margin:0;padding:0}
.daylist li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.daylist li:last-child{border-bottom:0}
.daylist .d{font-weight:800;line-height:1.15}
.daylist .d small{display:block;font-weight:600;color:var(--muted);font-size:.78em}
.daylist li.today .d{color:var(--accent-ink)}
.tag{display:inline-block;font-size:.75em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:currentColor}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:currentColor}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:currentColor}
.list{list-style:none;padding:0;margin:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:0 0 14px;background:var(--surface)}
details summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details[open]{padding-bottom:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;color:var(--muted);text-decoration:none;font-size:.72em;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent-ink)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:50;background:var(--text);color:var(--bg);
  padding:12px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);display:none}
.toast.show{display:block}
.chart svg{width:100%;height:auto;display:block}
.pre{white-space:pre-wrap;font:500 .85em/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:10px;padding:12px;overflow-wrap:anywhere}
.ex{padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{text-align:center;max-width:110px}
.stepper button{min-width:48px;padding:0}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 16px 14px;margin:0 0 14px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(249,115,22,.30),transparent 55%),linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero h1{color:#fff;margin:0 0 2px;font-size:1.45em;padding-right:92px}
.hero .sub{margin:0 0 12px;opacity:.95;font-weight:600;padding-right:92px}
.hero{--limb:#e5e7eb}
.hero .mascot-bg{position:absolute;right:8px;top:10px;width:108px;height:75px;opacity:.95;pointer-events:none}
.hero-grid{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.25)}
.ring .val{stroke:#fb923c;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}
.ring .lbl b{font-size:1.45em}
.ring .lbl span{font-size:.7em;font-weight:700;opacity:.95}
.hero-facts{display:grid;gap:6px;font-weight:700;font-size:.92em}
.hero-facts .big{font-size:1.6em;font-weight:900;line-height:1}
.strip{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.strip li{font-size:.72em;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px}
.strip .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.75)}
.strip .dot.done{background:#fb923c;border-color:#fb923c;color:#111}
.strip .dot.rest{border-style:dashed;border-color:rgba(255,255,255,.45)}
.strip .dot.miss{background:rgba(0,0,0,.18)}
.strip .today .dot{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.strip .dot svg{width:16px;height:16px}
.tb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;flex:none;color:#fff;vertical-align:middle}
.tb svg{width:18px;height:18px}
.tb.sm{width:24px;height:24px}.tb.sm svg{width:14px;height:14px}
.ttl{display:flex;align-items:center;gap:10px}
.card.t-easy{border-left:6px solid var(--t-easy)}.card.t-runwalk{border-left:6px solid var(--t-runwalk)}.card.t-long{border-left:6px solid var(--t-long)}
.card.t-strength{border-left:6px solid var(--t-strength)}.card.t-walk{border-left:6px solid var(--t-walk)}.card.t-cross{border-left:6px solid var(--t-cross)}
.card.t-rest{border-left:6px solid var(--t-rest)}.card.t-race{border-left:6px solid var(--t-race)}
.medals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;list-style:none;margin:0;padding:0}
.medal{text-align:center;padding:10px 4px;border-radius:14px;background:var(--surface-2)}
.medal .m{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(from 200deg,#fdba74,#f97316,#c2410c,#fdba74);color:#fff;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.medal .m svg{width:26px;height:26px}
.medal.locked .m{background:var(--line);color:var(--muted);box-shadow:none}
.medal b{display:block;font-size:.82em;line-height:1.2}
.medal small{display:block;font-size:.7em;color:var(--muted);line-height:1.25;margin-top:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin:0 0 14px}
.seg .chip span{width:100%;border:0;background:transparent}
.seg .chip input:checked + span{background:var(--t-strength);color:#fff}
.exc{display:grid;grid-template-columns:1fr;gap:8px}
.exc .head{display:flex;gap:10px;align-items:flex-start}
.exc .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--t-strength);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.exc.done .num{background:var(--ok)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figs.one{grid-template-columns:minmax(0,50%)}
.figs svg{width:100%;height:auto;background:var(--surface-2);border-radius:10px}
.figs .b{stroke:var(--text);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.figs .hd{fill:var(--surface-2);stroke:var(--text);stroke-width:2.4}
.figs .g{stroke:var(--muted);stroke-width:1.2;fill:none}
.figs .e{fill:var(--muted);stroke:none}
.figs .d{stroke:var(--t-strength);stroke-width:1.6;stroke-dasharray:3 3;fill:none}
.lvl .chip span{min-width:56px}
.lvl .chip input:checked + span{background:var(--t-strength);border-color:var(--t-strength);color:#fff}
.lvl .chip input:disabled + span{opacity:.45;cursor:not-allowed}
.steps{margin:0;padding-left:22px}.steps li{margin:2px 0}
.rpe .chip span{border-bottom:5px solid var(--c)}
.rpe .chip input:checked + span{background:var(--c);border-color:var(--c);color:#fff}
.rpe .chip span small{font-size:1em!important}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.5s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
.empty{text-align:center}.empty img{width:180px;height:auto;margin:0 auto 8px;display:block}
/* Letra en negrita (activa por defecto; se apaga en Perfil) */
:root[data-bold="1"] body{font-weight:600;line-height:1.6}
:root[data-bold="1"] .muted,:root[data-bold="1"] .hint,:root[data-bold="1"] .small{font-weight:600}
/* Modo sol: claro de alto contraste para leer bajo el sol */
:root[data-theme="sun"]{--bg:#ffffff;--surface:#ffffff;--surface-2:#f2f2f2;--line:#6b6b6b;--text:#000000;--muted:#2b2b2b;
  --accent:#9a3412;--accent-text:#ffffff;--accent-ink:#7c2d12;--accent-line:#000000;--chart:#9a3412;--wm-op:0;
  --ok:#0b5a24;--ok-bg:#e3f3e8;--warn:#5c3b00;--warn-bg:#fff4d6;--bad:#8a0f0f;--bad-bg:#fde4e4;--focus:#0b57d0;--shadow:none;--limb:#000000;color-scheme:light}
:root[data-theme="sun"] .card,:root[data-theme="sun"] details,:root[data-theme="sun"] input,:root[data-theme="sun"] select,:root[data-theme="sun"] textarea,:root[data-theme="sun"] .chip span{border-color:#000}
:root[data-theme="sun"] header.top,:root[data-theme="sun"] nav.tabs{border-color:#000}
/* Si el iPhone tiene "Aumentar contraste" */
@media (prefers-contrast: more){
  :root{--line:#5f5f5f;--muted:#2e2e2e}
  .card,details,.chip span,input,select,textarea{border-width:2px}
}
/* Colores forzados del sistema */
@media (forced-colors: active){
  body::before{display:none}
  .ring svg{forced-color-adjust:none}
  .card,details,.stat,.medal,.banner,.chip span,.tb,.strip .dot{border:1px solid CanvasText}
  .chip input:checked + span{background:Highlight;color:HighlightText;forced-color-adjust:none}
  :focus-visible{outline:3px solid Highlight}
  .hero{border:2px solid CanvasText}
}
.field-err{color:var(--bad);font-weight:700;font-size:.9em;margin:6px 0 0}
[aria-invalid="true"]{border-color:var(--bad)!important}
fieldset.invalid .chips{outline:2px solid var(--bad);outline-offset:4px;border-radius:12px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="top">
  <a class="brand" href="#hoy" aria-label="FitCoach, ir a Hoy">
    <span id="logoSlot"><img class="mascot" src="./logo.webp" alt="" width="75" height="52"></span>
  </a>
  <div class="top-actions">
    <button class="iconbtn" id="refreshBtn" data-act="force-update" aria-label="Actualizar la app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    <a class="avatar" id="avatarBtn" href="#perfil" aria-label="Perfil"></a>
  </div>
</header>
<div id="updateBar"></div>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Secciones">

<script>
'use strict';
/* FitCoach (versión de Pao) — un solo archivo, sin CDN, datos solo en este teléfono (localStorage). */
const APP_BUILD = '2026.11.10-pao-5';
const STORAGE_KEY = 'fitcoach_pao_v1';      // distinto al FitCoach Táctico: mismo dominio github.io, sin choques
const PREFS_KEY = 'fitcoach_pao_prefs_v1';
const LOGO_KEY = 'fitcoach_pao_logo_v1'; // imagen propia del logo (solo en este teléfono, fuera del respaldo)
const DEFAULT_LAT = 18.2269, DEFAULT_LON = -66.3913; // Orocovis (para la puesta del sol si no hay ubicación)
const HEAT_LIMIT_F = 90;

/* ───────── Estado ───────── */
const DEFAULT_STATE = () => ({
  v: 1,
  profile: { name:'', coach:'', raceName:'', raceDate:'', raceTime:'', goal:'', sessionTime:'17:00', days:[], shoes:[] },
  plan: [],      // {dateISO, type, distMi, durMin, notes, opt:{slot,text,distMi}}
  logs: [],      // sesiones registradas
  strength: { levels:{}, cur:null }, // niveles de Fuerza A/B y la rutina en curso
  checks: {},    // dateISO → chequeo "antes de empezar"
  lastBackup: null
});
let state = load();
let prefs = loadPrefs();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return DEFAULT_STATE();
    return migrate(JSON.parse(raw));
  }catch(e){ console.error('[load]', e); return DEFAULT_STATE(); }
}
function migrate(s){
  const d = DEFAULT_STATE();
  if(!s || typeof s !== 'object') return d;
  return { ...d, ...s, profile:{ ...d.profile, ...(s.profile||{}) },
    strength:(s.strength&&typeof s.strength==='object')?s.strength:{levels:{},cur:null},
    plan:Array.isArray(s.plan)?s.plan:[], logs:Array.isArray(s.logs)?s.logs:[], checks:(s.checks&&typeof s.checks==='object')?s.checks:{} };
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
  catch(e){ console.error('[save]', e); toast('No se pudo guardar en este teléfono. Haz un respaldo en Perfil.'); return false; }
}
function loadPrefs(){ const d = {theme:'auto',size:'normal',bold:true,seenBuild:null}; try{ return { ...d, ...(JSON.parse(localStorage.getItem(PREFS_KEY)) || {}) }; }catch(e){ return d; } }
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} applyPrefs(); }
function applyPrefs(){
  const r = document.documentElement;
  if(prefs.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', prefs.theme);
  r.setAttribute('data-size', prefs.size||'normal');
  r.setAttribute('data-bold', prefs.bold === false ? '0' : '1');
  const dark = prefs.theme === 'dark' || (prefs.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', prefs.theme === 'sun' ? '#ffffff' : dark ? '#141414' : '#fafaf7'));
}
applyPrefs();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ───────── Utilidades ───────── */
const $ = (s, el=document) => el.querySelector(s);
const esc = (v) => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoLocal(new Date());
const parseISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return isoLocal(d); };
const weekStart = iso => { const d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return isoLocal(d); }; // lunes
const DAYS_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYS_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDate = iso => { const d = parseISO(iso); return `${DAYS_SHORT[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDateLong = iso => { const d = parseISO(iso); return `${DAYS_LONG[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function fmtDur(sec){ sec = Math.round(sec||0); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function fmtPace(secPerMi){ if(!secPerMi || !isFinite(secPerMi)) return '—'; const m = Math.floor(secPerMi/60), s = Math.round(secPerMi%60); return s===60 ? `${m+1}:00 /mi` : `${m}:${pad(s)} /mi`; }
const r1 = n => Math.round((n||0)*10)/10;
/* "25" → 25 min; "25:30" → 25 min 30 s; "1:20:00" → 1 h 20 min */
function parseDur(str){
  str = String(str||'').trim().replace(',', '.'); if(!str) return 0;
  if(/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str)*60);
  const p = str.split(':').map(x => parseInt(x,10)); if(p.some(isNaN)) return 0;
  if(p.length===2) return p[0]*60 + p[1];
  if(p.length===3) return p[0]*3600 + p[1]*60 + p[2];
  return 0;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 3800); }
function athlete(){ return state.profile.name ? state.profile.name.trim().split(/\s+/)[0] : ''; }
function coach(){ return state.profile.coach ? state.profile.coach.trim() : 'tu entrenador'; }

/* ───────── Puesta del sol (NOAA simplificado) ───────── */
function sunsetMinutes(iso, lat=DEFAULT_LAT, lon=DEFAULT_LON){
  const d = parseISO(iso), start = new Date(d.getFullYear(),0,1);
  const n = Math.round((d - start)/86400000) + 1, g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const rad = Math.PI/180, la = lat*rad;
  const ha = Math.acos(Math.cos(90.833*rad)/(Math.cos(la)*Math.cos(decl)) - Math.tan(la)*Math.tan(decl))/rad;
  const utcMin = 720 - 4*(lon - ha) - eq;
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0) + utcMin*60000);
  return dt.getHours()*60 + dt.getMinutes();
}
const fmtClock = min => { const h = Math.floor(min/60), m = Math.round(min%60); const h12 = ((h+11)%12)+1; return `${h12}:${pad(m)} ${h<12?'a.m.':'p.m.'}`; };
const clockToMin = s => { const m = /^(\d{1,2}):(\d{2})/.exec(s||''); return m ? (+m[1])*60 + (+m[2]) : null; };

/* ───────── Plan ───────── */
const TYPES = {
  easy:{label:'Trote fácil', rpe:4, tip:'Ritmo de conversación: puedes hablar en frases completas (3–4 de 10).'},
  runwalk:{label:'Corre-camina', rpe:4, tip:'Alterna trote suave y caminata. Caminar es parte del plan, no es fallar.'},
  long:{label:'Larga', rpe:4, tip:'La más importante de la semana: lenta y constante. Si hace falta, camina un minuto y sigue.'},
  strength:{label:'Fuerza', rpe:7, tip:'Rutina con tu propio peso. Esfuerzo 7 de 10, nunca al fallo.'},
  walk:{label:'Caminata', rpe:3, tip:'Caminata tranquila para moverte y recuperar.'},
  cross:{label:'Otra actividad', rpe:4, tip:'Actividad suave distinta a correr.'},
  rest:{label:'Descanso', rpe:0, tip:'Descansar también es entrenar: así el cuerpo se adapta.'},
  race:{label:'Carrera', rpe:6, tip:'Sal tranquila, camina en las subidas si hace falta y disfruta.'}
};
const TICON = {
  easy:'<path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',
  runwalk:'<path d="M4 9h9l-3-3"/><path d="M20 15h-9l3 3"/>',
  long:'<path d="M5 21V4h12l-2.5 4L17 12H5"/>',
  strength:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  walk:'<circle cx="13" cy="4" r="2"/><path d="M10 21l2-7 3 3v4M12 14l-1-5 4 2 2 3M11 9l-3 2v3"/>',
  cross:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9l2 8"/>',
  rest:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  race:'<circle cx="12" cy="15" r="6"/><path d="M9 3l3 6 3-6"/><path d="M12 12.5l.9 1.8 2 .3-1.4 1.4.3 2-1.8-1-1.8 1 .3-2-1.4-1.4 2-.3z"/>'
};
const CHECK_ICON = '<path d="M5 12l5 5 9-10"/>';
function svgI(paths){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths}</svg>`; }
function tbadge(type, small){ const t = TICON[type] ? type : 'easy'; return `<span class="tb${small ? ' sm' : ''}" style="background:var(--t-${t})" aria-hidden="true">${svgI(TICON[t])}</span>`; }
function planFor(iso){ return state.plan.find(p => p.dateISO === iso) || null; }
function planText(p){
  if(!p) return 'Sin plan';
  const parts = [TYPES[p.type]?.label || 'Sesión'];
  if(p.distMi) parts.push(`${r1(p.distMi)} mi`); else if(p.durMin) parts.push(`${p.durMin} min`);
  return parts.join(' · ') + (p.strengthAfter ? ' + fuerza' : '');
}
/* Importador de bloques: "Lun: Fácil 25 min", "Dom: Larga 2.5 miles", "Sab PM opcional: 20 min" */
function parsePlanBlock(text){
  const DAY = {lun:0,mar:1,mie:2,jue:3,vie:4,sab:5,dom:6};
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const out = {}, opts = {}, unknown = [];
  String(text||'').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const n = norm(line);
    const om = /^(lun|mar|mie|jue|vie|sab|dom)[a-z]*\.?\s+(am|pm)\s+opcional\s*:\s*(.+)$/.exec(n);
    if(om){
      const raw = line.slice(line.indexOf(':')+1).trim();
      const dm = raw.match(/(\d+(?:[.,]\d+)?)\s*(?:miles?|millas?|mi)\b/i), tm = raw.match(/(\d+)\s*min/i);
      opts[DAY[om[1]]] = { slot:om[2].toUpperCase(), text:raw, distMi: dm ? parseFloat(dm[1].replace(',','.')) : null, durMin: tm ? +tm[1] : (/media hora/i.test(raw) ? 30 : null) };
      return;
    }
    const m = /^(lun|mar|mie|jue|vie|sab|dom)[a-z]*\.?\s*[:\-–]\s*(.+)$/.exec(n);
    if(!m){ unknown.push(line); return; }
    const body = line.slice(line.search(/[:\-–]/)+1).trim(), b = norm(body);
    let type = 'easy';
    if(/descanso|libre/.test(b)) type = 'rest';
    else if(/carrera|10k|10 k/.test(b) && /carrera/.test(b)) type = 'race';
    else if(/larga|largo/.test(b)) type = 'long';
    else if(/corre.?camina|trote.?caminata|intervalos de caminata/.test(b)) type = 'runwalk';
    else if(/fuerza/.test(b) && !/(trote|corre|fácil|facil)/.test(b)) type = 'strength';
    else if(/caminata|caminar/.test(b)) type = 'walk';
    else if(/bici|nadar|natacion|baile|otra actividad/.test(b)) type = 'cross';
    const dm = body.match(/(\d+(?:[.,]\d+)?)\s*(?:miles?|millas?|mi)\b/i), km = body.match(/(\d+(?:[.,]\d+)?)\s*km\b/i), tm = body.match(/(\d+)\s*min/i);
    let distMi = dm ? parseFloat(dm[1].replace(',','.')) : km ? parseFloat(km[1].replace(',','.'))*0.621371 : null;
    if(type==='rest') distMi = null;
    out[DAY[m[1]]] = { dow:DAY[m[1]], type, distMi: distMi>0 ? r1(distMi) : null, durMin: tm ? +tm[1] : (/media hora/i.test(body) ? 30 : null), notes: body, strengthAfter: type!=='strength' && /fuerza/.test(b) };
  });
  Object.keys(opts).forEach(k => { if(out[k]) out[k].opt = opts[k]; else out[k] = { dow:+k, type:'rest', distMi:null, durMin:null, notes:'Descanso', opt:opts[k] }; });
  return { sessions: Object.values(out).sort((a,b)=>a.dow-b.dow), unknown };
}

/* ───────── Registros y cálculos ───────── */
function logsOn(iso){ return state.logs.filter(l => l.dateISO === iso); }
function isRun(l){ return ['easy','runwalk','long','race'].includes(l.type); }
function weekMiles(startISO){ const end = addDays(startISO, 6); return r1(state.logs.filter(l => l.dateISO >= startISO && l.dateISO <= end && isRun(l)).reduce((a,l)=>a+(l.distMi||0),0)); }
function weekPlanMiles(startISO){
  const end = addDays(startISO, 6); let t = 0;
  state.plan.filter(p => p.dateISO >= startISO && p.dateISO <= end).forEach(p => { if(['easy','runwalk','long','race'].includes(p.type)) t += p.distMi || 0; });
  return r1(t);
}
/* Meta de la semana: en millas si el plan trae millas; si el plan viene en minutos, en minutos */
function weekGoal(ws){
  const end = addDays(ws, 6), runT = ['easy','runwalk','long','race'];
  const pm = weekPlanMiles(ws);
  if(pm > 0) return { unit:'mi', done: weekMiles(ws), plan: pm };
  const pmin = state.plan.filter(p => p.dateISO >= ws && p.dateISO <= end && runT.includes(p.type)).reduce((a,p) => a + (p.durMin||0), 0);
  const dmin = Math.round(state.logs.filter(l => l.dateISO >= ws && l.dateISO <= end && isRun(l)).reduce((a,l) => a + (l.durSec||0), 0) / 60);
  if(pmin > 0) return { unit:'min', done: dmin, plan: pmin };
  return { unit:'mi', done: weekMiles(ws), plan: 0 };
}
const goalTxt = g => `${g.done} de ${g.plan} ${g.unit === 'min' ? 'min' : 'mi'} previstos`.replace('mi previstos','mi previstas');
function totalMiles(){ return r1(state.logs.filter(isRun).reduce((a,l)=>a+(l.distMi||0),0)); }
function shoeMiles(id){ const s = state.profile.shoes.find(x => x.id===id); if(!s) return 0; return r1((+s.startMi||0) + state.logs.filter(l => l.shoeId===id).reduce((a,l)=>a+(l.distMi||0),0)); }
function longestRunMin(){ return Math.round(Math.max(0, ...state.logs.filter(isRun).map(l => (l.durSec||0)/60))); }
function metPlan(l, p){
  if(!p || p.type==='rest') return null;
  if(p.type==='strength') return l.type==='strength' ? true : null;
  if(p.distMi && l.distMi) return l.distMi >= p.distMi*0.9;
  if(p.durMin && l.durSec) return l.durSec >= p.durMin*60*0.9;
  return null;
}
function alertsFor(l, p){
  const a = [];
  if(l.redFlag) a.push({lvl:'bad', t:'Mareo, dolor de pecho o algo raro en el corazón: se detiene todo y se busca evaluación médica. Avísale a un adulto ahora.'});
  if((l.pain||0) >= 3) a.push({lvl:'bad', t:`Dolor ${l.pain}/10${l.painZone?' en '+l.painZone:''}: no corras otra vez hasta hablar con ${coach()}.`});
  else if((l.pain||0) >= 1) a.push({lvl:'warn', t:`Molestia ${l.pain}/10${l.painZone?' en '+l.painZone:''}: vigílala. Si sube o cambia tu forma de correr, para y avisa.`});
  const exp = p ? (TYPES[p.type]?.rpe || 4) : (TYPES[l.type]?.rpe || 4);
  if(l.rpe != null && isRun(l) && l.rpe >= exp + 2) a.push({lvl:'warn', t:`Esfuerzo ${l.rpe}/10: más fuerte de lo previsto (${exp}/10). La próxima, más lento o con más caminatas.`});
  if(isRun(l) && l.talk === 'no' && ['easy','runwalk','long'].includes(p?.type || l.type)) a.push({lvl:'warn', t:'No pudiste hablar: el ritmo fue muy rápido para una sesión fácil.'});
  if(l.sleep != null && l.sleep < 6) a.push({lvl:'warn', t:`Dormiste ${l.sleep} h: con menos de 6 h la sesión debe ser suave o corta.`});
  if(l.heatF != null && l.heatF > HEAT_LIMIT_F) a.push({lvl:'warn', t:`Sensación térmica ${l.heatF} °F: por encima de ${HEAT_LIMIT_F} °F se acorta o se pasa a otra hora.`});
  if(l.time && l.durSec){ const end = clockToMin(l.time) + l.durSec/60, ss = sunsetMinutes(l.dateISO); if(end > ss + 5) a.push({lvl:'warn', t:`Terminó después de la puesta del sol (${fmtClock(ss)}). Ropa clara o reflectiva y siempre acompañada.`}); }
  return a;
}

/* ───────── Informe .md ───────── */
function sessionReport(l){
  const p = planFor(l.planDateISO || l.dateISO), met = metPlan(l, p), ws = weekStart(l.dateISO);
  const shoe = state.profile.shoes.find(s => s.id === l.shoeId);
  const L = [];
  L.push(`# Sesión — ${athlete() || 'Atleta'} — ${fmtDate(l.dateISO)}${l.time ? ' ' + fmtClock(clockToMin(l.time)) : ''}`, '');
  L.push(`- Plan: ${p ? planText(p) + (p.notes ? ` (${p.notes})` : '') : 'sin plan para ese día'}`);
  const done = [TYPES[l.type]?.label || l.type];
  if(l.durSec) done.push(fmtDur(l.durSec)); if(l.distMi) done.push(`${r1(l.distMi)} mi`);
  if(l.durSec && l.distMi) done.push(fmtPace(l.durSec / l.distMi));
  L.push(`- Hecho: ${done.join(' · ')}`);
  if(met != null) L.push(`- Cumplida: ${met ? 'sí' : 'no'}`);
  if(l.rpe != null) L.push(`- Esfuerzo: ${l.rpe}/10`);
  if(isRun(l)){
    if(l.talk) L.push(`- Habla: ${({si:'frases completas', aratos:'a ratos', no:'no podía hablar'})[l.talk]}`);
    if(l.walks) L.push(`- Caminatas: ${({ninguna:'ninguna', pocas:'pocas', muchas:'muchas'})[l.walks]}`);
  }
  if(l.type==='strength' && l.routine){ const r = ROUTINES[l.routine]; L.push(`- Rutina: ${r.name} · ${(l.exDone||[]).length} de ${r.ex.length} ejercicios`);
    r.ex.forEach(e => { const lv = (l.levels||{})[e.id] || 1; L.push(`  - ${(l.exDone||[]).includes(e.id) ? '✔' : '✘'} ${e.n} · nivel ${lv}: ${e.lv[lv-1]}`); }); }
  L.push(`- Dolor: ${l.pain ? `${l.pain}/10${l.painZone ? ' (' + l.painZone + ')' : ''}` : '0'}`);
  if(l.sleep != null) L.push(`- Sueño la noche antes: ${l.sleep} h`);
  if(l.heatF != null) L.push(`- Sensación térmica: ${l.heatF} °F`);
  if(l.hrAvg) L.push(`- FC media / máx (muñeca, solo referencia): ${l.hrAvg}${l.hrMax ? ' / ' + l.hrMax : ''} lpm`);
  if(l.elevFt) L.push(`- Desnivel positivo: ${l.elevFt} ft`);
  if(l.source) L.push(`- Fuente: ${l.source}`);
  if(shoe) L.push(`- Tenis: ${shoe.name} (${shoeMiles(shoe.id)} mi)`);
  L.push(`- Semana: ${goalTxt(weekGoal(ws))} · ${weekMiles(ws)} mi · Acumulado: ${totalMiles()} mi`);
  const al = alertsFor(l, p);
  if(al.length){ L.push('', '## Alertas'); al.forEach(x => L.push(`- ${x.t}`)); }
  if(l.notes){ L.push('', '## Notas', l.notes); }
  L.push('', `_FitCoach ${APP_BUILD}_`);
  return L.join('\n');
}
function weekReport(ws){
  const L = [`# Semana ${fmtDate(ws)} – ${fmtDate(addDays(ws,6))} — ${athlete() || 'Atleta'}`, ''];
  const runs = state.logs.filter(l => l.dateISO >= ws && l.dateISO <= addDays(ws,6));
  const runL = runs.filter(isRun), easy = runL.filter(l => (l.rpe ?? 0) <= 4).length;
  L.push(`- Semana: ${goalTxt(weekGoal(ws))} · ${weekMiles(ws)} mi hechas · Acumulado: ${totalMiles()} mi`);
  if(runL.length) L.push(`- Sesiones de correr fáciles (esfuerzo ≤4): ${easy} de ${runL.length} (${Math.round(easy/runL.length*100)} %)`);
  L.push(`- Sesión más larga del plan hasta hoy: ${longestRunMin()} min`, '', '## Día por día');
  for(let i=0;i<7;i++){
    const iso = addDays(ws,i), p = planFor(iso), ls = logsOn(iso);
    const done = ls.map(l => `${TYPES[l.type]?.label}${l.durSec ? ' ' + fmtDur(l.durSec) : ''}${l.distMi ? ' ' + r1(l.distMi) + ' mi' : ''}${l.rpe != null ? ' · ' + l.rpe + '/10' : ''}${l.pain ? ' · dolor ' + l.pain : ''}`).join('; ');
    L.push(`- ${fmtDate(iso)}: plan ${p ? planText(p) : '—'} → ${done || 'nada registrado'}`);
  }
  const al = runs.flatMap(l => alertsFor(l, planFor(l.planDateISO || l.dateISO)).map(a => `${fmtDate(l.dateISO)}: ${a.t}`));
  if(al.length){ L.push('', '## Alertas'); al.forEach(a => L.push(`- ${a}`)); }
  L.push('', `_FitCoach ${APP_BUILD}_`);
  return L.join('\n');
}
/* Capturas del reloj: viven solo en memoria (no ocupan espacio); se envían con el informe */
const SHOTS = new Map();
let pendingShot = null;
async function shareLog(log){
  const text = sessionReport(log), title = `Sesión ${fmtDate(log.dateISO)}`, shot = SHOTS.get(log.id);
  if(shot && navigator.share && navigator.canShare && navigator.canShare({ files:[shot] })){
    try{ await navigator.share({ title, text, files:[shot] }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  } else if(shot){ toast('Este teléfono no deja enviar la imagen junto al texto. Envíala aparte.'); }
  shareText(title, text, `sesion-${log.dateISO}.md`);
}
function shotField(id){
  const f = id ? SHOTS.get(id) : pendingShot;
  return `<div class="field"><span class="hint" style="margin-bottom:6px">Captura del reloj (opcional). Se envía con el informe; no se guarda en el teléfono.</span>
    <div class="row"><label class="btn ghost" for="shotIn">${f ? 'Cambiar captura' : 'Adjuntar captura del reloj'}</label><input id="shotIn" type="file" accept="image/*" class="sr-only" data-for="${esc(id || '')}">
    ${f ? `<span class="small" id="shotName">📎 ${esc(f.name || 'captura')}</span><button type="button" class="plain" data-act="shot-del" data-for="${esc(id || '')}">Quitar</button>` : ''}</div></div>`;
}
async function shareText(title, text, filename){
  try{
    if(navigator.share){ await navigator.share({ title, text }); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  copyText(text, filename);
}
async function copyText(text, filename){
  try{ await navigator.clipboard.writeText(text); toast('Copiado. Pégalo en el mensaje.'); }
  catch(e){ downloadFile(filename || 'informe.md', text, 'text/markdown'); }
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime + ';charset=utf-8'}), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
async function shareFile(name, content, mime){
  try{
    const file = new File([content], name, {type: mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  }catch(e){ if(e && e.name === 'AbortError') return false; }
  downloadFile(name, content, mime); return true;
}

/* ───────── Clima (Open-Meteo, sin clave) ───────── */
function getCoords(){
  return new Promise(res => {
    if(!navigator.geolocation) return res({lat:DEFAULT_LAT, lon:DEFAULT_LON, src:'Orocovis'});
    navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude, src:'tu ubicación'}), () => res({lat:DEFAULT_LAT, lon:DEFAULT_LON, src:'Orocovis'}), {timeout:8000, maximumAge:600000});
  });
}
async function fetchFeelsLike(){
  const c = await getCoords();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat.toFixed(3)}&longitude=${c.lon.toFixed(3)}&current=apparent_temperature,temperature_2m,relative_humidity_2m&temperature_unit=fahrenheit&timezone=auto`;
  const r = await fetch(url); if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json(); const cur = j.current || {};
  if(cur.apparent_temperature == null) throw new Error('sin dato');
  return { feels: Math.round(cur.apparent_temperature), temp: Math.round(cur.temperature_2m), hum: cur.relative_humidity_2m, src:c.src };
}

/* ───────── Archivo del reloj (TCX / GPX) ───────── */
function parseWatchFile(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('El archivo no se pudo leer.');
  const by = (el, name) => Array.from(el.getElementsByTagNameNS('*', name));
  const num = (el, name) => { const n = by(el, name)[0]; return n ? parseFloat(n.textContent) : NaN; };
  const isTCX = by(doc, 'Trackpoint').length > 0 || by(doc, 'Lap').length > 0;
  const pts = (isTCX ? by(doc, 'Trackpoint') : by(doc, 'trkpt')).map(tp => {
    const t = by(tp, isTCX ? 'Time' : 'time')[0];
    const hrEl = isTCX ? by(tp, 'HeartRateBpm')[0] : by(tp, 'hr')[0];
    const lat = isTCX ? num(tp, 'LatitudeDegrees') : parseFloat(tp.getAttribute('lat'));
    const lon = isTCX ? num(tp, 'LongitudeDegrees') : parseFloat(tp.getAttribute('lon'));
    return { t: t ? Date.parse(t.textContent) : NaN, hr: hrEl ? parseFloat(hrEl.textContent) : NaN, lat, lon,
      ele: num(tp, isTCX ? 'AltitudeMeters' : 'ele'), dist: isTCX ? num(tp, 'DistanceMeters') : NaN };
  }).filter(p => !isNaN(p.t));
  if(!pts.length) throw new Error('El archivo no trae puntos con hora.');
  // Duración: suma de vueltas válidas en TCX (descarta la vuelta vacía 4294967 s); si no, primero→último punto
  let durSec = 0;
  if(isTCX){ by(doc, 'Lap').forEach(lap => { const v = parseFloat(by(lap,'TotalTimeSeconds')[0]?.textContent || '0'); if(v > 0 && v < 4294967) durSec += v; }); }
  if(!durSec) durSec = (pts[pts.length-1].t - pts[0].t)/1000;
  // Distancia: último DistanceMeters (TCX) o suma por coordenadas
  let distM = NaN;
  if(isTCX){ const ds = pts.map(p => p.dist).filter(v => !isNaN(v)); if(ds.length) distM = Math.max(...ds); }
  if(isNaN(distM) || !distM){
    distM = 0; const R = 6371000, rad = Math.PI/180;
    for(let i=1;i<pts.length;i++){ const a = pts[i-1], b = pts[i]; if([a.lat,a.lon,b.lat,b.lon].some(isNaN)) continue;
      const dLa = (b.lat-a.lat)*rad, dLo = (b.lon-a.lon)*rad;
      const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLo/2)**2; distM += 2*R*Math.asin(Math.sqrt(h)); }
  }
  const hrs = pts.map(p => p.hr).filter(v => v > 30 && v < 240);
  let gain = 0, last = null;
  pts.forEach(p => { if(isNaN(p.ele)) return; if(last == null){ last = p.ele; return; } const d = p.ele - last; if(Math.abs(d) >= 2){ if(d > 0) gain += d; last = p.ele; } });
  const start = new Date(pts[0].t);
  return { dateISO: isoLocal(start), time: `${pad(start.getHours())}:${pad(start.getMinutes())}`, durSec: Math.round(durSec),
    distMi: r1(distM/1609.344), hrAvg: hrs.length ? Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length) : null, hrMax: hrs.length ? Math.max(...hrs) : null,
    elevFt: gain ? Math.round(gain*3.28084) : null, source: isTCX ? 'archivo TCX' : 'archivo GPX' };
}

const JUMP_UNLOCK = 4; // sesiones de fuerza sin dolor antes de abrir los saltos
const exById = id => { for(const k of ['A','B']){ const e = ROUTINES[k].ex.find(x => x.id === id); if(e) return e; } return null; };
function sState(){ state.strength = state.strength || { levels:{}, cur:null }; state.strength.levels = state.strength.levels || {}; return state.strength; }
function exLevel(id){ return sState().levels[id] || 1; }
function strengthLogs(){ return state.logs.filter(l => l.type === 'strength'); }
function jumpsUnlocked(){ return strengthLogs().filter(l => !l.pain).length >= JUMP_UNLOCK; }
function nextRoutine(){ const ls = strengthLogs(); const last = ls.length ? ls[ls.length-1].routine : null; return last === 'A' ? 'B' : 'A'; }
/* Sube de nivel cuando lo completó en sus 2 últimas sesiones de fuerza, sin dolor y con esfuerzo ≤7 */
function readyToLevelUp(ex){
  const lv = exLevel(ex.id); if(lv >= 3) return false;
  if(ex.jump && !jumpsUnlocked()) return false;
  const ls = strengthLogs().filter(l => (l.exDone||[]).includes(ex.id) && (l.levels||{})[ex.id] === lv).slice(-2);
  return ls.length === 2 && ls.every(l => !l.pain && (l.rpe ?? 10) <= 7);
}
function figSvg(key, label){
  if(PHOTOS[key]) return `<img class="photo" src="${PHOTOS[key]}" alt="${esc(label)}" loading="lazy" decoding="async">${PHOTO_NOTE[key] ? `<p class="photo-note">${esc(PHOTO_NOTE[key])}</p>` : ''}`;
  const f = FIGS[key]; if(!f) return '';
  const one = f.p.length === 1;
  return `<div class="figs${one ? ' one' : ''}" role="img" aria-label="${esc(label)}">` + f.p.map(p => {
    let s = '<svg viewBox="0 0 100 76" aria-hidden="true" focusable="false"><line class="g" x1="3" y1="70" x2="97" y2="70"/>' + (p.x || '');
    (p.l || []).forEach(l => { s += `<polyline class="b" points="${l}"/>`; });
    return s + `<circle class="hd" cx="${p.h[0]}" cy="${p.h[1]}" r="4.6"/>${p.y || ''}</svg>`;
  }).join('') + '</div>';
}

function weekComplete(){
  const weeks = [...new Set(state.plan.map(p => weekStart(p.dateISO)))];

  return weeks.some(ws => { const days = state.plan.filter(p => weekStart(p.dateISO) === ws && p.type !== 'rest');

function setLogoFromFile(file){
  const out = $('#logoOut');
  if(!/^image\//.test(file.type)){ out.textContent = 'Ese archivo no es una imagen.'; return; }
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 256, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    try{ localStorage.setItem(LOGO_KEY, c.toDataURL('image/png')); renderLogo(); render(false); toast('Imagen del logo cambiada.'); }
    catch(e){ out.textContent = 'No hay espacio para esa imagen. Prueba con una más pequeña.'; }
  };
  img.onerror = () => { URL.revokeObjectURL(url); out.textContent = 'No se pudo abrir la imagen.'; };
  img.src = url;
}

function heroHtml(t){

      </div>

function newDraft(){

  const type = p && TYPES[p.type] && p.type !== 'rest' ? p.type : 'easy';
  return { id:null, dateISO:t, planDateISO:t, time:`${pad(now.getHours())}:${pad(now.getMinutes())}`, type,
    durSec:0, distMi:null, rpe:null, talk:null, walks:null, painZone:'', pain:0, redFlag:false,
    sleep: c.sleep6 === false ? 5.5 : (prevSleep ?? 8), heatF: c.feels ?? null, shoeId:lastShoe, notes:'', exDone:[],
    routine: type === 'strength' ? nextRoutine() : null };

function readForm(){
  const f = $('#logForm'); if(!f) return draft;
  const g = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
  const radioVal = n => { const el = f.querySelector(`input[name="${n}"]:checked`); return el ? el.value : null; };
  const numOr = (v, fb=null) => { v = String(v).replace(',', '.'); const n = parseFloat(v); return isNaN(n) ? fb : n; };
  draft.type = radioVal('type') || draft.type;
  draft.dateISO = g('fDate') || todayISO(); draft.planDateISO = draft.dateISO; draft.time = g('fTime');
  draft.durSec = parseDur(g('fDur')); draft.distMi = draft.type === 'strength' ? null : numOr(g('fDist'));
  const rpe = radioVal('rpe'); draft.rpe = rpe == null ? null : +rpe;
  draft.talk = radioVal('talk'); draft.walks = radioVal('walks');
  draft.painZone = radioVal('painZone') || ''; draft.pain = draft.painZone ? (+g('fPain') || 1) : 0;
  draft.redFlag = !!$('#fRed')?.checked;
  draft.sleep = numOr(g('fSleep')); draft.heatF = numOr(g('fHeat'));
  draft.shoeId = g('fShoe'); draft.hrAvg = numOr(g('fHr')); draft.hrMax = numOr(g('fHrMax')); draft.elevFt = numOr(g('fElev'));
  draft.notes = g('fNotes');
  draft.routine = radioVal('routine') || draft.routine || null;
  draft.exDone = Array.from(f.querySelectorAll('input[name="ex"]:checked')).map(x => x.value);
  return draft;
}

function saveLog(){

  const dErr = $('#fDurErr'), rErr = $('#rpeErr'), dIn = $('#fDur'), rSet = $('#rpeSet');
  const setErr = (el, input, msg) => { if(!el) return; el.hidden = !msg; el.textContent = msg || ''; if(input && input.tagName === 'INPUT') input.setAttribute('aria-invalid', msg ? 'true' : 'false'); if(input && input.tagName === 'FIELDSET') input.classList.toggle('invalid', !!msg); };
  setErr(dErr, dIn, draft.durSec ? '' : 'Escribe el tiempo, por ejemplo 25 o 25:30.');
  setErr(rErr, rSet, draft.rpe == null ? 'Toca un número del 0 al 10.' : '');
  if(errs.length){ toast('Falta: ' + errs.join(', ') + '.'); const first = !draft.durSec ? dIn : $('input[name="rpe"]'); first?.focus(); return; }
  const isNew = !draft.id, before = earnedIds();
  const rec = { ...draft, id: draft.id || uid(), savedAt: Date.now() };
  if(rec.type === 'strength'){ rec.routine = rec.routine || 'A'; if(isNew || !rec.levels) rec.levels = Object.fromEntries(ROUTINES[rec.routine].ex.map(e => [e.id, exLevel(e.id)])); if(isNew) sState().cur = null; }
  const i = state.logs.findIndex(l => l.id === rec.id);
  if(i >= 0) state.logs[i] = rec; else state.logs.push(rec);
  state.logs.sort((a,b) => (a.dateISO + (a.time||'')).localeCompare(b.dateISO + (b.time||'')));
  if(!save()) return;
  if(pendingShot){ SHOTS.set(rec.id, pendingShot); pendingShot = null; }

function barChart(weeks){
  const W = 340, H = 180, pl = 30, pb = 26, pt = 10, max = Math.ceil(Math.max(2, ...weeks.map(w => Math.max(w.done, w.plan))) * 1.1 / 2) * 2;
  const bw = (W - pl - 6) / weeks.length, y = v => pt + (H - pt - pb) * (1 - v/max);
  const ticks = [0, max/2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`;
  ticks.forEach(v => { s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl-4}" y="${y(v)+4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${v}</text>`; });
  weeks.forEach((w,i) => {
    const x = pl + i*bw + 4, h = H - pb - y(w.done);
    s += `<rect x="${x}" y="${y(w.done)}" width="${bw-8}" height="${Math.max(0,h)}" rx="4" style="fill:var(--chart)"/>`;
    if(w.plan) s += `<line x1="${x-2}" x2="${x+bw-6}" y1="${y(w.plan)}" y2="${y(w.plan)}" style="stroke:var(--text)" stroke-width="3"/>`;
    const d = parseISO(w.ws); s += `<text x="${x+(bw-8)/2}" y="${H-8}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${d.getDate()}/${d.getMonth()+1}</text>`;
  });
  return s + '</svg>';
}
function lineChart(runs){
  if(runs.length < 2) return '<p class="muted">Necesitas al menos 2 sesiones para ver la línea.</p>';
  const W = 340, H = 180, pl = 30, pb = 26, pt = 10, max = Math.max(30, ...runs.map(l => l.durSec/60)) * 1.15;
  const x = i => pl + 8 + i * (W - pl - 16) / (runs.length - 1), y = v => pt + (H - pt - pb) * (1 - v/max), yr = v => pt + (H - pt - pb) * (1 - v/10);
  let s = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`;
  [0, Math.round(max/2), Math.round(max)].forEach(v => { s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl-4}" y="${y(v)+4}" font-size="11" text-anchor="end" style="fill:var(--muted)">${v}</text>`; });
  s += `<polyline fill="none" style="stroke:var(--chart)" stroke-width="3" stroke-linejoin="round" points="${runs.map((l,i) => `${x(i)},${y(l.durSec/60)}`).join(' ')}"/>`;
  runs.forEach((l,i) => { if(l.rpe != null) s += `<circle cx="${x(i)}" cy="${yr(l.rpe)}" r="4.5" style="fill:var(--surface);stroke:var(--text);stroke-width:2"/>`; });
  [0, runs.length-1].forEach(i => { const d = parseISO(runs[i].dateISO); s += `<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${d.getDate()}/${d.getMonth()+1}</text>`; });
  return s + '</svg>';
}

document.addEventListener('click', async e => {

  const act = b.dataset.act, log = b.dataset.id ? state.logs.find(l => l.id === b.dataset.id) : null;
  switch(act){
    case 'share-log': if(log) shareLog(log); break;
    case 'shot-del': { const id = b.dataset.for; if(id) SHOTS.delete(id); else pendingShot = null; const box = b.closest('.field'); if(box) box.outerHTML = shotField(id); toast('Captura quitada.'); break; }
    case 'copy-log': if(log) copyText(sessionReport(log), `sesion-${log.dateISO}.md`); break;
    case 'dl-log': if(log) shareFile(`sesion-${log.dateISO}.md`, sessionReport(log), 'text/markdown'); break;
    case 'share-week': shareText('Resumen de la semana', weekReport(b.dataset.ws), `semana-${b.dataset.ws}.md`); break;
    case 'del-log':
      if(log && confirm(`¿Borrar la sesión del ${fmtDate(log.dateISO)}? No se puede deshacer.`)){ state.logs = state.logs.filter(l => l.id !== log.id); save(); draft = null; location.hash = '#hoy'; toast('Sesión borrada.'); }
      break;
    case 'wk': weekOffset += +b.dataset.d; render(false); $(`[data-act="wk"][data-d="${b.dataset.d}"]`)?.focus(); break;
    case 'imp-paste':
      try{ $('#impText').value = await navigator.clipboard.readText(); toast('Bloque pegado.'); }catch(err){ toast('No se pudo leer el portapapeles. Mantén el dedo en el cuadro y toca Pegar.'); }
      break;
    case 'imp-preview': previewImport(); break;
    case 'imp-save': applyImport(); break;
    case 'check-done': { const iso = b.dataset.date; state.checks[iso] = state.checks[iso] || {}; ['company','sleep6','water','nopain','healthy'].forEach(k => { if(state.checks[iso][k] == null) state.checks[iso][k] = false; }); save(); render(false); $('#chk')?.focus(); break; }
    case 'heat': case 'heat-form': {
      const out = act === 'heat' ? $('#heatOut') : null; b.disabled = true; if(out) out.textContent = 'Buscando…';
      try{
        const w = await fetchFeelsLike();
        if(act === 'heat'){ const iso = b.dataset.date; state.checks[iso] = { ...(state.checks[iso]||{}), feels:w.feels }; save(); render(false); }
        else { $('#fHeat').value = w.feels; $('#fHeat').dispatchEvent(new Event('input', {bubbles:true})); toast(`Sensación térmica: ${w.feels} °F (${w.src}).`); }
      }catch(err){ console.error('[clima]', err); if(out) out.textContent = 'Sin conexión para el clima. Míralo en la app del tiempo.'; else toast('No se pudo buscar el clima. Escríbelo a mano.'); }
      b.disabled = false; break;
    }
    case 'add-shoe': {
      const n = $('#sName').value.trim(); if(!n){ toast('Escribe el modelo.'); $('#sName').focus(); return; }
      state.profile.shoes.push({ id:uid(), name:n, startMi: parseFloat(($('#sMi').value || '0').replace(',', '.')) || 0 }); save(); render(false); toast('Tenis agregados.'); break;
    }
    case 'del-shoe': { const s = state.profile.shoes.find(x => x.id === b.dataset.id); if(s && confirm(`¿Quitar ${s.name}? Las sesiones se quedan.`)){ state.profile.shoes = state.profile.shoes.filter(x => x.id !== s.id); save(); render(false); } break; }
    case 'backup': {
      const name = `fitcoach-respaldo-${todayISO()}.json`, data = JSON.stringify({ app:'fitcoach-pao', build:APP_BUILD, savedAt:new Date().toISOString(), state }, null, 1);
      const ok = await shareFile(name, data, 'application/json');
      if(ok){ state.lastBackup = Date.now(); save(); render(false); toast('Respaldo listo. Guárdalo en Archivos.'); }
      break;
    }
    case 'reset':
      if(confirm('¿Borrar TODOS los datos de este teléfono?') && confirm('Última confirmación: se borran perfil, plan y sesiones.')){ state = DEFAULT_STATE(); save(); draft = null; location.hash = '#perfil'; render(true); toast('Datos borrados.'); }
      break;
    case 'update': checkUpdate(true); break;
    case 'force-update': forceUpdate(); break;
    case 'seen-version': prefs.seenBuild = APP_BUILD; savePrefs(); render(false); $('#hoyPlan')?.focus(); break;
    case 'logo-reset': try{ localStorage.removeItem(LOGO_KEY); }catch(e){} renderLogo(); render(false); toast('Volviste al logo de FitCoach.'); break;
    case 'lvl': { sState().levels[b.dataset.id] = +b.dataset.lv; save(); render(false); toast(`Nivel ${b.dataset.lv}. ¡Bien!`); $('#h_' + b.dataset.id)?.focus(); break; }
    case 'str-finish': {
      const c = sState().cur; if(!c) break;
      draft = { ...newDraft(), type:'strength', routine:c.routine, exDone:c.done.slice(), durSec:0 };
      draft._fromStrength = true; location.hash = '#registrar'; break;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.check){ const iso = t.dataset.date; state.checks[iso] = { ...(state.checks[iso]||{}), [t.dataset.check]: t.checked };
    const c = state.checks[iso]; const keys = ['company','sleep6','water','nopain','healthy'];
    if(keys.every(k => c[k] != null)){ save(); const id = t.id; render(false); $('#' + id)?.focus(); } else save();
    return; }
  if(t.dataset.exdone){ const c = sState().cur; const id = t.dataset.exdone; c.done = t.checked ? [...new Set([...c.done, id])] : c.done.filter(x => x !== id); save();
    const sec = t.closest('.exc'); sec.classList.toggle('done', t.checked); sec.querySelector('.num').innerHTML = t.checked ? svgI(CHECK_ICON) : (ROUTINES[c.routine].ex.findIndex(e => e.id === id) + 1);
    const fb = $('[data-act="str-finish"]'); if(fb) fb.textContent = `Terminé la rutina (${c.done.length} de ${ROUTINES[c.routine].ex.length})`; return; }
  if(t.name === 'sroutine'){ const c = sState().cur; c.routine = t.value; c.done = []; save(); render(false); $(`input[name="sroutine"][value="${t.value}"]`)?.focus(); return; }
  if(t.dataset.lvl){ sState().levels[t.dataset.lvl] = +t.value; save(); const id = t.dataset.lvl, e = exById(id);
    const p = t.closest('.exc').querySelector('.head p'); if(p) p.innerHTML = `<b>Nivel ${t.value}:</b> ${esc(e.lv[t.value-1])}`; return; }
  if(t.name === 'theme'){ prefs.theme = t.value; savePrefs(); return; }
  if(t.name === 'size'){ prefs.size = t.value; savePrefs(); return; }
  if(t.id === 'prefBold'){ prefs.bold = t.checked; savePrefs(); return; }
  if(t.id === 'restoreIn' && t.files[0]) restoreBackup(t.files[0]);
  if(t.id === 'logoIn' && t.files[0]) setLogoFromFile(t.files[0]);
  if(t.id === 'shotIn' && t.files[0]){ const id = t.dataset.for, f = t.files[0];
    if(!/^image\//.test(f.type)){ toast('Ese archivo no es una imagen.'); return; }
    if(id) SHOTS.set(id, f); else pendingShot = f;
    const box = t.closest('.field'); if(box){ box.outerHTML = shotField(id); } toast('Captura adjuntada.'); $('#shotIn')?.focus(); }
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'profForm') return; e.preventDefault();
  const g = id => $('#' + id).value.trim(), p = state.profile;
  p.name = g('pName'); p.coach = g('pCoach'); p.raceName = g('pRace'); p.raceDate = g('pDate'); p.raceTime = g('pRTime'); p.goal = g('pGoal'); p.sessionTime = g('pSTime') || '17:00';
  p.days = Array.from(document.querySelectorAll('input[name="pDays"]:checked')).map(x => x.value);
  if(save()){ renderAvatar(); toast('Perfil guardado.'); }
});

/* Importar bloque: revisar primero, luego confirmar */
let pendingImport = null;
function previewImport(){
  const text = $('#impText').value, ws = $('#impWeek').value, out = $('#impOut');
  const { sessions, unknown } = parsePlanBlock(text);
  if(!sessions.length){ out.innerHTML = `<div class="banner warn"><p>No encontré días. Cada línea debe empezar con Lun, Mar, Mié, Jue, Vie, Sab o Dom seguido de dos puntos.</p></div>`; pendingImport = null; return; }
  const replaced = state.plan.filter(p => p.dateISO >= ws && p.dateISO <= addDays(ws,6)).length;
  pendingImport = { ws, sessions };
  out.innerHTML = `<div class="card" style="margin-top:12px"><h3>Así quedaría la semana</h3><ul class="list">${sessions.map(s => `<li><b>${esc(fmtDate(addDays(ws, s.dow)))}</b> · ${esc(planText(s))}${s.opt ? ` <span class="tag">Opcional ${esc(s.opt.slot)}</span> ${esc(s.opt.text)}` : ''}</li>`).join('')}</ul>
    ${unknown.length ? `<p class="small" style="color:var(--warn)">No entendí ${unknown.length} línea(s): ${esc(unknown.slice(0,3).join(' · '))}</p>` : ''}
    ${replaced ? `<div class="banner warn"><p>Ya hay ${replaced} día(s) en esa semana. Se reemplaza toda la semana.</p></div>` : ''}
    <button data-act="imp-save">Guardar la semana</button></div>`;
  out.querySelector('h3').setAttribute('tabindex','-1'); out.querySelector('h3').focus();
}
function applyImport(){
  if(!pendingImport) return;
  const { ws, sessions } = pendingImport, end = addDays(ws, 6);
  state.plan = state.plan.filter(p => p.dateISO < ws || p.dateISO > end);
  sessions.forEach(s => state.plan.push({ dateISO:addDays(ws, s.dow), type:s.type, distMi:s.distMi, durMin:s.durMin, notes:s.notes, strengthAfter:!!s.strengthAfter, opt:s.opt || null }));
  state.plan.sort((a,b) => a.dateISO.localeCompare(b.dateISO));
  if(save()){ pendingImport = null; weekOffset = Math.round((parseISO(ws) - parseISO(weekStart(todayISO())))/(7*86400000)); render(true); toast('Semana guardada.'); }
}
async function restoreBackup(file){
  const out = $('#restoreOut');
  try{
    const j = JSON.parse(await file.text()), s = j && j.state;
    if(!s || j.app !== 'fitcoach-pao' || !Array.isArray(s.logs) || !Array.isArray(s.plan)) throw new Error('No es un respaldo de este FitCoach.');
    if(!confirm(`Este respaldo tiene ${s.logs.length} sesiones y ${s.plan.length} días de plan. Reemplaza lo que hay en este teléfono (${state.logs.length} sesiones). ¿Continuar?`)) return;
    state = migrate(s); save(); render(true); toast('Respaldo recuperado.');
  }catch(err){ console.error('[respaldo]', err); out.innerHTML = `<div class="banner bad"><p>${esc(err.message || 'No se pudo leer el archivo.')}</p></div>`; }
}

/* ───────── Service worker y actualizaciones ───────── */
let swReg = null;
function showUpdateBar(){
  $('#updateBar').innerHTML = `<div class="banner ok" style="margin:12px 16px 0" role="status"><p><b>Hay una versión nueva.</b></p><button data-act="apply-update">Actualizar ahora</button></div>`;
}
document.addEventListener('click', e => { if(e.target.closest('[data-act="apply-update"]') && swReg && swReg.waiting) swReg.waiting.postMessage({type:'SKIP_WAITING'}); });
/* ↻: busca la versión nueva, borra solo la caché de esta app y recarga. No toca los datos (localStorage). */
async function forceUpdate(){
  const b = $('#refreshBtn');
  if(!navigator.onLine){ toast('Sin conexión. Conéctate a internet y vuelve a tocar ↻.'); return; }
  b.classList.add('spin'); b.disabled = true; b.setAttribute('aria-label','Actualizando…'); toast('Buscando la versión nueva…');
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){ await reg.update().catch(() => {}); if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    }
    if(window.caches){ const keys = await caches.keys(); await Promise.all(keys.filter(k => k.startsWith('fitcoach-pao-')).map(k => caches.delete(k))); }
  }catch(e){ console.warn('[actualizar]', e); }
  const u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u.toString());
}
async function checkUpdate(manual){
  if(!swReg){ if(manual) toast('Actualizaciones disponibles solo desde el ícono instalado.'); return; }
  try{ await swReg.update(); if(manual) toast(swReg.waiting ? 'Hay una versión nueva arriba.' : 'Ya tienes la última versión.'); }catch(e){ if(manual) toast('Sin conexión.'); }
}
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js').then(reg => {
    swReg = reg;
    if(reg.waiting) showUpdateBar();
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if(w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(); }); });
  }).catch(err => console.warn('[sw]', err));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloaded) return; reloaded = true; location.reload(); });
}

try{ const u = new URL(location.href); if(u.searchParams.has('v')){ u.searchParams.delete('v'); history.replaceState(null, '', u.pathname + u.search + u.hash); } }catch(e){}
renderLogo();
window.addEventListener('hashchange', () => render(true));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && route.tab === 'hoy') render(false); });
render(false);
</script>
